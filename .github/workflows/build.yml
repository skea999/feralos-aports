name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    # runner = GitHub Ubuntu VM; steps run INSIDE the Alpine container below.
    # alpine:latest = latest STABLE (matches installer's branch: latest-stable)
    runs-on: ubuntu-latest
    # alpine:latest = latest STABLE (matches installer's branch: latest-stable).
    # Registry history: Docker Hub anonymous pulls hit the rate limit (3
    # blocked runs), ECR Public then hit "Data limit exceeded" (3 more,
    # 2026-10-18) — mirror.gcr.io is Google's unauthenticated Docker Hub
    # mirror with generous limits.
    container: mirror.gcr.io/library/alpine:latest
    steps:
      - name: Install toolchain
        run: apk add --no-cache alpine-sdk git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Import or generate signing key
        env:
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
          ABUILD_KEYNAME: ${{ secrets.ABUILD_KEYNAME }}
        run: |
          set -e
          mkdir -p ~/.abuild
          if [ -n "$ABUILD_PRIVKEY" ] && [ -n "$ABUILD_KEYNAME" ]; then
            printf '%s\n' "$ABUILD_PRIVKEY" > ~/.abuild/"$ABUILD_KEYNAME".rsa
            chmod 600 ~/.abuild/"$ABUILD_KEYNAME".rsa
            # abuild-sign -e (called by abuild -F) requires the .pub to exist;
            # derive it from the private key instead of needing a 3rd secret
            openssl rsa -pubout -in ~/.abuild/"$ABUILD_KEYNAME".rsa \
              > ~/.abuild/"$ABUILD_KEYNAME".rsa.pub
            # abuild needs the packager identity to match the key
            printf 'PACKAGER="FeralOS <dev@feralos.org>"\nPACKAGER_PRIVKEY="$HOME/.abuild/%s.rsa"\n' \
              "$ABUILD_KEYNAME" > ~/.abuild/abuild.conf
            # trust the key locally so apk can verify installed packages
            cp ~/.abuild/"$ABUILD_KEYNAME".rsa.pub /etc/apk/keys/
          else
            # no secrets yet (Step 0): ephemeral key so abuild can sign;
            # real key + feralos.pub land in Step 3
            abuild-keygen -a -n
          fi

      - name: Verify signing (smoke)
        run: |
          set -e
          # abuild-sign embeds the signature into the file itself (apk v2
          # format) and removes its temp — so verify the file CHANGED
          echo "smoke" > /tmp/sign-test
          cp /tmp/sign-test /tmp/sign-test.orig
          abuild-sign /tmp/sign-test
          cmp -s /tmp/sign-test /tmp/sign-test.orig && {
            echo "signing did not modify file — key setup broken"; exit 1; }
          echo "signing OK"

      - name: Seed published packages (skip-if-unchanged)
        run: |
          set -e
          BASE=https://skea999.github.io/feralos-aports
          REPO="$HOME/packages/src/x86_64"
          mkdir -p "$REPO"
          # Pull the PUBLISHED repo (index + apks) into the abuild REPODEST
          # so that: (1) unchanged packages are skipped in the build step
          # below, and (2) inter-package deps of CHANGED packages resolve
          # from the local repo even when the dep itself is skipped.
          if wget -q "$BASE/feralos-aports/x86_64/APKINDEX.tar.gz" -O /tmp/pub.tgz; then
            mkdir -p /tmp/pub && tar -xzf /tmp/pub.tgz -C /tmp/pub APKINDEX
            # APKINDEX blocks: P:<name> / V:<ver> / ... / blank line.
            # filename = <name>-<ver>.apk where ver already carries -r<N>.
            # trailing echo guarantees the last block is flushed.
            { cat /tmp/pub/APKINDEX; echo; } | while IFS= read -r line; do
              case "$line" in
                'P:'*) name=${line#P:} ;;
                'V:'*) ver=${line#V:} ;;
                '')
                  if [ -n "$name" ] && [ -n "$ver" ]; then
                    wget -q "$BASE/feralos-aports/x86_64/$name-$ver.apk" -O "$REPO/$name-$ver.apk" \
                      || { echo "seed failed: $name-$ver (will rebuild)"; rm -f "$REPO/$name-$ver.apk"; }
                  fi
                  name=; ver= ;;
              esac
            done
            echo "seeded published apks: $(ls "$REPO" | wc -l)"
          else
            echo "no published index yet (first run) — building everything"
          fi
          # index the seeded repo NOW: abuild resolves depends against
          # $REPODEST, and a rebuilt package whose deps are all skipped
          # would otherwise fail ("no such package") — the per-build
          # abuild index updates take over from the first build on
          if [ -n "$(ls -A "$REPO" 2>/dev/null)" ]; then
            ( cd "$REPO" && apk index \
                --description "FeralOS src" \
                --rewrite-arch x86_64 \
                -o APKINDEX.tar.gz *.apk \
              && abuild-sign APKINDEX.tar.gz )
          fi

      - name: Build all packages
        run: |
          set -e
          # apk-tools 3 resolves deps from cache only; abuild -r does not
          # run `apk update` itself — populate the index cache first
          apk update
          found=0
          built=" "
          REPO="$HOME/packages/src/x86_64"
          # dependency-safe multi-pass build: every abuild success updates
          # and signs the local src/x86_64 repo index, so a package whose
          # deps are built later in the same run (alphabetical order does
          # not guarantee topological order: dms-shell -> quickshell ->
          # cli11) succeeds on a following pass. Bounded passes; a pass
          # with zero progress while packages remain unbuilt is a real
          # build failure, not an ordering artifact.
          for pass in $(seq 1 10); do
            progress=0
            pending=""
            for d in src/*/APKBUILD; do
              [ -e "$d" ] || continue
              pkgdir=$(dirname "$d")
              case "$built" in *" $pkgdir "*) continue;; esac
              found=1
              # skip-if-unchanged: source the APKBUILD for pkgname and
              # pkgver-pkgrel; when the published repo already carries
              # that exact apk, reuse it (seeded into REPO above) and
              # save the full abuild run.
              pv=$( ( cd "$pkgdir" && . ./APKBUILD >/dev/null 2>&1 && printf '%s %s-r%s' "$pkgname" "$pkgver" "$pkgrel" ) ) || pv=""
              pkgname=${pv%% *}
              fullver=${pv#* }
              if [ -n "$pkgname" ] && [ "$pkgname" != "$fullver" ] && [ -f "$REPO/$pkgname-$fullver.apk" ]; then
                echo "skip $pkgdir ($pkgname-$fullver already published)"
                built="$built$pkgdir "
                progress=1
                continue
              fi
              if [ -n "$pkgname" ]; then
                # rebuilt package: drop older published builds of the same
                # name so the final index carries ONE version per package
                # (versions start with a digit — the glob is name-safe:
                # foo-[0-9]*.apk never matches foo-bar-*.apk)
                rm -f "$REPO/$pkgname-"[0-9]*.apk
              fi
              pending="$pending $pkgdir"
              echo "::group::build $pkgdir (pass $pass)"
              if ( cd "$pkgdir" && abuild -Fr ); then
                built="$built$pkgdir "
                progress=1
              fi
              echo "::endgroup::"
            done
            [ -z "$pending" ] && break
            [ "$progress" -eq 1 ] || { echo "no progress, unbuilt:$pending"; exit 1; }
          done
          [ -z "$pending" ] || { echo "unbuilt after 10 passes:$pending"; exit 1; }
          if [ "$found" -eq 0 ]; then
            echo "No APKBUILDs yet — build step skipped (skeleton repo)"
          fi

      - name: Index repositories
        run: |
          set -e
          for arch_dir in ~/packages/*/x86_64; do
            [ -d "$arch_dir" ] || continue
            repo=$(basename "$(dirname "$arch_dir")")
            ( cd "$arch_dir" && apk index \
                --description "FeralOS $repo" \
                --rewrite-arch x86_64 \
                -o APKINDEX.tar.gz *.apk \
              && abuild-sign APKINDEX.tar.gz )
          done

      - name: Smoke-install built packages
        run: |
          set -e
          # 1) per-package isolated smoke: EVERY apk must install cleanly
          #    (deps resolve, triggers run) on a fresh root. This catches
          #    broken packages independently of provider conflicts between
          #    variants (incus vs incus-feature both provide cmd:incusd,
          #    so they can never coexist in one root by Alpine design).
          #    Runs AFTER Index: inter-package deps (cli11 -> quickshell)
          #    resolve from our local indexed repos, Alpine CDN for the rest.
          cache=/tmp/apk-smoke-cache
          mkdir -p "$cache"
          { cat /etc/apk/repositories
            # repo ROOT dir (no /x86_64): apk appends the arch itself,
            # a /x86_64-suffixed entry would be doubled to x86_64/x86_64
            for d in ~/packages/*; do [ -d "$d/x86_64" ] && echo "$d"; done
          } > /tmp/smoke-repositories
          for apkfile in ~/packages/*/x86_64/*.apk; do
            [ -f "$apkfile" ] || continue
            root=$(mktemp -d)
            apk add --quiet --root "$root" --initdb \
              --repositories-file /tmp/smoke-repositories \
              --cache-dir "$cache" \
              --allow-untrusted "$apkfile" \
              || { echo "smoke install FAIL: $apkfile"; exit 1; }
            rm -rf "$root"
            echo "smoke install OK: $(basename "$apkfile")"
          done
          # 2) shared-root install for the artifact checks below. Skip
          #    mutually exclusive provider variants — each one already
          #    proved installable standalone in step 1, and a real machine
          #    always picks exactly one variant.
          # incus-dinit -> incus, incus-feature-agent-dinit -> incus-feature
          # (incus and incus-feature conflict on cmd:incusd)
          # incus-feature-user-dinit -> incus-feature (also provides incusd)
          # polkit base vs polkit-elogind are mutually exclusive variants:
          # keep base (polkit-dinit + quickshell depend on it), skip the
          # elogind variant artifacts (isolated smoke covers them)
          # gnome-keyring-user-dinit (niri secrets set) vs oo7-user-dinit
          # (niriWayle secrets set): both ship the org.freedesktop.secrets
          # unit/override and gnome-keyring conflicts with oo7-server on
          # usr/share/dbus-1/services/org.freedesktop.secrets.service —
          # keep oo7 (flagship), skip the keyring variant artifacts
          # dolphin-user-dinit (kde set) vs nautilus-user-dinit (niri set):
          # both ship the org.freedesktop.FileManager1 activation override —
          # mutually exclusive DE variants, keep nautilus here
          skip_pkgs="incus-dinit incus-feature-agent-dinit incus-feature-user-dinit polkit-elogind polkit-elogind-dev polkit-elogind-libs polkit-elogind-dinit gnome-keyring-user-dinit dolphin-user-dinit"
          for apkfile in ~/packages/*/x86_64/*.apk; do
            [ -f "$apkfile" ] || continue
            name=$(basename "$apkfile" | sed -E 's/-[0-9][^-]*-r[0-9]+\.apk$//')
            case " $skip_pkgs " in *" $name "*)
              echo "skip shared-root install (variant): $name"; continue;; esac
            # shared root also needs the local repos: inter-package runtime
            # deps (dms-shell -> quickshell) resolve only from ~/packages
            apk add --allow-untrusted \
              --repositories-file /tmp/smoke-repositories "$apkfile"
          done
          # expected artifacts from built packages (update as packages land)
          # dinit-chimera: services dir = /lib/dinit.d (Alpine standard —
          # stock dinit does NOT scan /usr/lib/dinit.d, see APKBUILD prepare())
          test -f /lib/dinit.d/boot || { echo "missing boot service"; exit 1; }
          test -x /lib/dinit.d/early/helpers/mnt || { echo "missing mnt helper"; exit 1; }
          test -f /usr/libexec/dinit/init || { echo "missing init wrapper"; exit 1; }
          grep -q '/usr/bin/dinit' /usr/libexec/dinit/init || { echo "init wrapper does not target /usr/bin/dinit"; exit 1; }
          # init wrapper must NOT be at sbin location (OpenRC coexistence)
          ! apk info -L dinit-chimera | grep -qE '(^| )usr/(s)?bin/init$' || { echo "init wrapper leaked into bin dir"; exit 1; }
          # 2b: device-manager hook — exists, syntax-clean, settle action runs
          test -x /usr/libexec/dinit-devd || { echo "missing dinit-devd hook"; exit 1; }
          sh -n /usr/libexec/dinit-devd || { echo "dinit-devd syntax error"; exit 1; }
          /usr/libexec/dinit-devd settle || { echo "dinit-devd settle failed"; exit 1; }
          # 2c: cryptdisks hook — exists, syntax-clean, graceful with no crypttab
          test -x /usr/libexec/dinit-cryptdisks || { echo "missing dinit-cryptdisks hook"; exit 1; }
          sh -n /usr/libexec/dinit-cryptdisks || { echo "dinit-cryptdisks syntax error"; exit 1; }
          /usr/libexec/dinit-cryptdisks early start || { echo "dinit-cryptdisks (no crypttab) must exit 0"; exit 1; }
          # 2e: console hook — exists, syntax-clean, graceful without config
          test -x /usr/libexec/dinit-console || { echo "missing dinit-console hook"; exit 1; }
          sh -n /usr/libexec/dinit-console || { echo "dinit-console syntax error"; exit 1; }
          /usr/libexec/dinit-console keyboard || { echo "dinit-console keyboard must exit 0"; exit 1; }
          # 2d: suite syntax validation (Alpine dinit ships dinitcheck)
          dinit-check -d /lib/dinit.d boot || { echo "dinitcheck boot FAILED"; exit 1; }
          # system must waits-for the RELOCATED package drop-in (prepare() sed)
          grep -q 'waits-for.d: /lib/dinit.d/boot.d' /lib/dinit.d/system || { echo "system waits-for.d not relocated to /lib"; exit 1; }
          # getty-dinit: template body present (enablement is rules-driven)
          test -f /lib/dinit.d/getty || { echo "missing getty template"; exit 1; }
          # 6: per-service verification — every -dinit service file exists and is valid
          svc_fail=0
          for svc in /lib/dinit.d/*; do
            [ -f "$svc" ] || continue
            case "$svc" in *.target|*.d) continue ;; esac
            sh -n "$svc" 2>/dev/null || { echo "SYNTAX: $svc"; svc_fail=1; }
          done
          # key services must exist
          for svc in boot system local.target network.target login.target \
                     dbus sshd chronyd cronie acpid irqbalance earlyoom \
                     vector networking getty; do
            test -f "/lib/dinit.d/$svc" || { echo "missing: $svc"; svc_fail=1; }
          done
          [ "$svc_fail" -eq 0 ] || { echo "service checks FAILED"; exit 1; }
          # sd-tmpfiles runtime smoke: the GCC build MUST NOT segfault on
          # --create (use-after-scope in CONF_PATHS_STRV, upstream issue #5 —
          # Alpine's r3 crashes here; our r993 carries the static-storage patch)
          rc=0; sd-tmpfiles --create --boot || rc=$?
          case "$rc" in
            0|65|73) echo "sd-tmpfiles runtime OK (exit $rc)" ;;
            *) echo "sd-tmpfiles runtime FAIL (exit $rc — 139/134 = crash)"; exit 1 ;;
          esac
          echo "smoke-install OK"

      - name: Collect site
        run: |
          set -e
          mkdir -p site
          cp feralos.pub site/ 2>/dev/null || true
          if [ -d ~/packages ]; then
            cp -r ~/packages/. site/ 2>/dev/null || true
          fi
          # normalize published layout: abuild REPODEST subdir follows the
          # package parent dir (src/) — publish under the STABLE documented
          # repo name instead, so client URLs never follow internal layout
          if [ -d site/src ] && [ ! -d site/feralos-aports ]; then
            mv site/src site/feralos-aports
          fi
          # keep artifact non-empty while repo has no built packages
          [ -n "$(ls -A site 2>/dev/null)" ] || echo "skeleton — no packages yet" > site/README.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  client-test:
    # Real PC flow: keyring first (adds key+repo), then all our packages
    # WITHOUT --allow-untrusted → signature must verify. Alpine CDN stays
    # available for transitive deps.
    if: github.ref == 'refs/heads/main'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    # same registry rationale as the build job (see container comment above)
    container: mirror.gcr.io/library/alpine:latest
    steps:
      - name: Checkout (package list)
        uses: actions/checkout@v4
      - name: Install all our packages from Pages (keyring first, real flow)
        run: |
          set -e
          BASE=https://skea999.github.io/feralos-aports
          # real PC flow: keyring provides key+repo; apk-tools 3 does not support direct https URL for apk add (see https://github.com/openwrt/luci/issues/8410)
          # so fetch with wget then local install — still tests the published URL and the fixed repo (no /x86_64 suffix, no sed)
          wget -q "$BASE/feralos-aports/x86_64/feralos-keyring-1-r0.apk" -O /tmp/feralos-keyring.apk
          apk add --allow-untrusted /tmp/feralos-keyring.apk
          # verify keyring shipped correct repo (without /x86_64 — apk appends $arch)
          grep -qx "https://skea999.github.io/feralos-aports/feralos-aports" /etc/apk/repositories.d/feralos.list || { echo "feralos.list wrong:"; cat /etc/apk/repositories.d/feralos.list; exit 1; }
          apk update
          # mutually exclusive provider variants: incus-dinit pulls `incus`,
          # incus-feature-agent-dinit pulls `incus-feature`, and both
          # packages ship cmd:incusd so they can never coexist on one
          # machine. polkit-elogind-dinit pulls the elogind polkit variant,
          # mutually exclusive with the base `polkit` installed by the
          # polkit dir. gnome-keyring-user-dinit (niri secrets set) conflicts
          # with oo7-user-dinit (niriWayle secrets set): same unit/override
          # names, and gnome-keyring vs oo7-server on the secrets activation
          # file. dolphin-user-dinit (kde set) conflicts with
          # nautilus-user-dinit (niri set) on org.freedesktop.FileManager1.
          # The build job smoke-installs each variant standalone;
          # here (one simulated machine) we install the remaining packages.
          skip_pkgs="incus-dinit incus-feature-agent-dinit incus-feature-user-dinit polkit-elogind-dinit gnome-keyring-user-dinit dolphin-user-dinit"
          for d in src/*/APKBUILD; do
            pkg=$(basename "$(dirname "$d")")
            [ "$pkg" = feralos-keyring ] && continue
            [ -e "$d" ] || continue
            case " $skip_pkgs " in *" $pkg "*)
              echo "Skipping variant (conflicts on cmd:incusd): $pkg"; continue;; esac
            echo "Installing $pkg..."
            apk add "$pkg"
            apk policy "$pkg" | grep 'skea999.github.io/feralos-aports'
          done
      - name: Validate suite (dinit-check)
        run: |
          set -e
          dinit-check -d /lib/dinit.d boot
          dinit-check -d /lib/dinit.d system
          # our sd-tools (989.0.99.0-r0, tmpfiles lifetime patch) must WIN over
          # Alpine's runtime-broken 0.99.0-r3 — 989 major component always
          # outranks any Alpine version field-by-field (apk numeric compare)
          apk policy sd-tools | grep -q '989.0.99.0-r0' || { echo "sd-tools did not resolve to our 989.0.99.0-r0:"; apk policy sd-tools; exit 1; }
          rc=0; sd-tmpfiles --create --boot || rc=$?
          case "$rc" in
            0|65|73) echo "sd-tmpfiles runtime OK (exit $rc)" ;;
            *) echo "sd-tmpfiles runtime FAIL (exit $rc — crash?)"; exit 1 ;;
          esac
      - name: Sanity files and binaries
        run: |
          set -e
          for f in /lib/dinit.d/early/helpers/mnt \
                   /usr/libexec/dinit/init \
                   /usr/libexec/dinit-devd \
                   /usr/libexec/dinit-cryptdisks; do
            test -e "$f" || { echo "missing: $f"; exit 1; }
          done
          grep -q '/usr/bin/dinit' /usr/libexec/dinit/init || {
            echo "init wrapper does not target /usr/bin/dinit"; exit 1; }
          for bin in dinitctl dinit-check sd-tmpfiles udevadm matugen; do
            command -v "$bin" >/dev/null || { echo "missing $bin"; exit 1; }
          done
          echo "client verification OK"
