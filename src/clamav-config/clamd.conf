# FeralOS clamd configuration (package-shipped over the Alpine sample —
# ADR-013; the installer no longer writes it).
#
# Explicit LogFile so the vector source and the generic logrotate rule have a
# stable path. Foreground stays default-off: both service units pass the CLI
# flag, which overrides the config file (clamd.c: argv scan beats optget).
# freshclam updates the DB whenever a network is up (offline it just logs
# failed attempts). Runtime dirs (/var/log/clamav, /run/clamav) are created
# by the service units themselves (OpenRC checkpath / dinit wrapper).
LogFile /var/log/clamav/clamd.log
LogTime yes
PidFile /run/clamav/clamd.pid
LocalSocket /run/clamav/clamd.sock
DatabaseDirectory /var/lib/clamav
User clamav
Foreground no
