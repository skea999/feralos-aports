# FeralOS freshclam configuration (real values — the vendor sample ships
# "Example" and freshclam 1.x refuses to run with it: "No DatabaseMirror",
# exit 9). The installer-time DB snapshot used the same values via an
# ephemeral config; on the target freshclam-daemon updates the DB with this.
DatabaseMirror database.clamav.net
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
