# cpufrequtils-dinit configuration
# Sourced by /usr/libexec/dinit-cpufrequtils; absent values fall back to the
# defaults baked into the wrapper/script.

# cpufreq-set arguments applied per-CPU at boot (start) and at
# shutdown (stop: return to a known-good governor).
CPUFREQ_START_OPTS="--governor ondemand"
CPUFREQ_STOP_OPTS="--governor performance"
