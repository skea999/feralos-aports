# dbus-dinit configuration
# Sourced by the dbus dinit service; empty/absent values keep the
# defaults baked into the wrapper/script.

# Extra dbus-daemon arguments. Do NOT repeat the fixed flags
# (--system --nofork --nopidfile --syslog-only --print-address=3):
# they live in /usr/lib/dinit/dbus and the pipefd readiness depends on them.
DBUS_OPTS=""
