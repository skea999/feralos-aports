# dnsmasq-dinit configuration
# Sourced by the dnsmasq dinit service; empty/absent values keep the
# defaults baked into the wrapper/script.

# Extra dnsmasq arguments (appended after the fixed --keep-in-foreground --pid-file=).
DNSMASQ_OPTS=""
# Alternative config file (--conf-file=). Must point to a real config file:
# empty means dnsmasq reads NO config at all (no DHCP/DNS settings).
DNSMASQ_CFGFILE="/etc/dnsmasq.conf"
