# earlyoom-dinit configuration
# Sourced by /usr/lib/dinit/earlyoom (tiered victim selection).
#
# TIER 1 — user programs, killed FIRST   (--prefer, +300 oom_score)
#         browsers, editors, office, chat, games, file/media/viewer apps
#         (native AND flatpak: flatpak apps keep their own comm name, e.g.
#         a flatpak firefox shows as "firefox" — same regex, same tier)
# TIER 2 — desktop session, MEDIUM weight (intentionally absent from both
#         lists: niri, dms, pipewire, wireplumber, wayvnc, xdg portals,
#         terminals and shells die by natural oom_score order — session
#         lost, system survives)
# TIER 3 — system core, NEVER chosen    (--ignore = hard skip; earlyoom can
#         no longer pick these, so the kernel OOM killer decides afterwards.
#         NOTE: plain --avoid only subtracts 300 oom_score and CAN still be
#         outbid by a huge scorer — that is why --ignore is used here.)
#         PID1, session manager, bus, seat/session, network + wpa, login
#         path, logging, time, cron, ssh, flatpak infra, hw daemons
#
# Regex rules: matched against /proc/pid/comm (first 15 BYTES, case
# sensitive); no spaces, no glob characters ([ ] * ?); case handled by
# repeating the name (discord|Discord), not bracket expressions. Names
# longer than 15 chars are written truncated AS THE KERNEL SEES THEM
# (telegram-deskt, gnome-disk-uti) — short names stay full (thunderbird,
# chromium are under 15 and never truncate). Kernel threads always have
# oom_score 0 and are never selected; kthreadd (PID2) is listed as
# belt-and-braces only.

# Base flags: thresholds 10% mem / 10% swap (earlyoom defaults), report every 60s.
EARLYOOM_OPTS="-m 10 -s 10 -r 60"

# Tier 1: user programs — first to die. Grouped:
#   browsers: chrome chromium firefox brave msedge vivaldi-bin opera
#     librewolf falkon epiphany qutebrowser
#   chat/mail: discord/Discord telegram(-deskt) signal slack zoom teams
#     vesktop element ferdium konversation thunderbird kmail geary evolution
#     mailspring betterbird
#   office/PDF/notes: soffice.bin onlyoffice-desk abiword scribus obsidian
#     zettlr logseq joplin typora marktext xournal(+pp) calibre
#     ebook-viewer foliate zathura evince papers okular qpdfview
#   KDE: dolphin(+dolphin-emu) kate kwrite gwenview ark spectacle kdenlive
#     krita kcalc kfind kmix skanlite partitionmanag kolourpaint kruler
#     kamoso kontact korganizer akregator kompare kid3 k3b
#   GNOME: nautilus loupe gnome-calculat gnome-text-edi gnome-software
#     gnome-logs gnome-usage gnome-disks gnome-boxes gnome-maps gnome-weather
#     gnome-music gnome-calendar gnome-contacts gnome-clocks snapshot baobab
#     file-roller
#   XFCE: thunar ristretto mousepad
#   media: vlc mpv celluloid smplayer audacious rhythmbox elisa lollypop
#     strawberry cmus spotify pitivi shotcut openshot audacity blender
#   images: gimp inkscape darktable rawtherapee digikam feh imv nomacs
#     mypaint pinta
#   games/emu: steam lutris heroic bottles retroarch pcsx2 ryujinx
#     prismlauncher minecraft-laun
#   torrent/dl: qbittorrent transmission deluge ktorrent uget
#   tools/dev: code codium code-oss zed meld kdiff3 filezilla remmina
#     rustdesk virt-manager VirtualBoxVM flameshot swappy obs
#     gpu-screen-reco syncthing timeshift pika-backup deja-dup newsflash
#     liferea + installer apps: cosmic-(files/edit/player/screens/store/
#     settings) eog galculator simple-scan gnome-firmware gnome-disk-uti
#     ksystemlog kcron system-config-p firewalld-gui rclone
#   flatpak/sandbox launcher during app start: bwrap. Nix-installed apps
#     keep their binary comm name (obsidian, zed…): extend here.
EARLYOOM_PREFER="(^|/)(chrome|chromium|firefox|brave|msedge|electron|vivaldi-bin|opera|librewolf|falkon|epiphany|qutebrowser|discord|Discord|telegram|telegram-deskt|signal|slack|zoom|teams|vesktop|element|ferdium|konversation|thunderbird|kmail|geary|evolution|mailspring|betterbird|soffice|soffice\.bin|onlyoffice-desk|abiword|scribus|obsidian|zettlr|logseq|joplin|typora|marktext|xournalpp|xournal|calibre|ebook-viewer|foliate|zathura|evince|papers|okular|qpdfview|dolphin|dolphin-emu|kate|kwrite|gwenview|ark|spectacle|kdenlive|krita|kcalc|kfind|kmix|skanlite|partitionmanag|kolourpaint|kruler|kamoso|kontact|korganizer|akregator|kompare|kid3|k3b|nautilus|loupe|gnome-calculat|gnome-text-edi|gnome-software|gnome-logs|gnome-usage|gnome-disks|gnome-boxes|gnome-maps|gnome-weather|gnome-music|gnome-calendar|gnome-contacts|gnome-clocks|snapshot|baobab|file-roller|thunar|ristretto|mousepad|vlc|mpv|celluloid|smplayer|audacious|rhythmbox|elisa|lollypop|strawberry|cmus|spotify|pitivi|shotcut|openshot|audacity|blender|gimp|inkscape|darktable|rawtherapee|digikam|feh|imv|nomacs|mypaint|pinta|lutris|heroic|bottles|retroarch|pcsx2|ryujinx|prismlauncher|minecraft-laun|qbittorrent|transmission|deluge|ktorrent|uget|code|codium|code-oss|zed|meld|kdiff3|filezilla|remmina|rustdesk|virt-manager|VirtualBoxVM|flameshot|swappy|obs|gpu-screen-reco|syncthing|timeshift|pika-backup|deja-dup|newsflash|liferea|cosmic-(files|edit|player|screens|store|settings)|eog|galculator|simple-scan|gnome-firmware|gnome-disk-uti|ksystemlog|kcron|system-config-p|firewalld-gui|rclone|bwrap)$"

# Tier 3: system core — never chosen while anything else exists.
# Alpine comm facts (15-char truncations): cronie daemon = crond;
# flatpak-session-helper = flatpak-session; flatpak-system-helper =
# flatpak-system-; power-profiles-daemon = power-profiles-.
# init = PID1 on the OpenRC path (dinit is PID1 on the dinit path).
# seat/session hw: seatd udevd upowerd rtkit-daemon colord; printers:
# cupsd cups-browsed saned avahi-daemon; greeters: greetd regreet sddm
# cosmic-greeter; bt/modem/store: bluetoothd ModemManager packagekitd;
# misc hw daemons: acpid irqbalance rasdaemon smartd; LAN services:
# dnsmasq.
EARLYOOM_IGNORE="^(dinit|earlyoom|kthreadd|init|turnstiled|elogind|dbus-daemon|polkitd|NetworkManager|wpa_supplicant|vector|klogd|chronyd|crond|cronie|sshd|agetty|greetd|regreet|sddm|cosmic-greeter|incusd|nix-daemon|fwupd|udisksd|podman|firewalld|power-profiles-|accounts-daemon|flatpak-portal|flatpak-session|flatpak-system-|seatd|udevd|upowerd|rtkit-daemon|colord|cupsd|cups-browsed|saned|avahi-daemon|bluetoothd|ModemManager|packagekitd|acpid|irqbalance|rasdaemon|smartd|dnsmasq)$"
