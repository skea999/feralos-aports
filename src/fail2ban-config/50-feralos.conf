# FeralOS fail2ban jail (package-shipped — ADR-013; the installer no longer
# writes it). nftables-native banaction: the base install has NO iptables
# (firewalld is nftables-only and fail2ban's f2b nftables table is independent
# of firewalld's tables — coexistence validated by the harness).
# backend=polling: the log file is vector's sink (/var/log/auth.log); sshd
# logs facility auth → auth.log. On the very first boot fail2ban may start
# before vector's first write — the service's restart policy self-heals it.
# Sorts after the vendor jail.d/alpine-ssh.conf, so these values win.
[DEFAULT]
banaction = nftables-multiport
banaction_allports = nftables-allports
usedns = no
bantime = 1h
findtime = 10m
maxretry = 5
ignoreip = 127.0.0.1/8 ::1

[sshd]
enabled = true
port = ssh
logpath = /var/log/auth.log
backend = polling
maxretry = 5
