# freshclam configuration (clamav-dinit)
# Sourced by the freshclam dinit service; empty/absent values keep the
# defaults baked into the wrapper/script. Update cadence comes from
# /etc/clamav/freshclam.conf (Checks, default 12/day); offline it logs
# failed attempts and keeps retrying.

# Extra freshclam arguments (appended after the fixed --daemon --foreground
# --user clamav).
FRESHCLAM_ARGS=""
