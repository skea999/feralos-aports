# iptables-dinit configuration
# Sourced by /usr/libexec/dinit-iptables; absent values fall back to the
# defaults baked into the wrapper/script.

# Saved ruleset restored at boot via
# iptables-restore -w "$IPTABLES_RESTORE_WAIT" "$IPTABLES_RULES".
IPTABLES_RULES="/etc/iptables/iptables.rules"
IPTABLES_RESTORE_WAIT="3"
