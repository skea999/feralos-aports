# nftables-dinit configuration
# Sourced by /usr/libexec/dinit-nftables; absent values fall back to the
# defaults baked into the wrapper/script.

# Ruleset loaded at boot (nft -f "$NFTABLES_RULES").
NFTABLES_RULES="/etc/nftables.nft"
# Flush the ruleset on stop ("yes"/"no").
NFTABLES_FLUSH_ON_STOP="yes"
