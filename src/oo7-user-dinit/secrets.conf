# oo7 secret service daemon (oo7-user-dinit). Sourced and exported by
# /usr/libexec/oo7-user-dinit/secrets before exec'ing /usr/libexec/oo7-daemon.
#
# RUST_LOG: tracing filter for the daemon. INFO enables the
# "Received unlock request" delivery line in secrets.log (the harness
# oo7_pam_unlock runtime proof greps it); the installer sets RUST_LOG=info
# on enableDebug installs. Default (unset) = the daemon's ERROR-only
# built-in filter.
#RUST_LOG=info
