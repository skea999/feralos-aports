# tracee configuration (dinit env-file AND OpenRC /etc/conf.d — same file,
# installed to both paths by the package)
# Sourced by the tracee service; empty/absent values keep the upstream
# defaults baked into the wrapper/script.

# Extra tracee arguments (appended after the fixed --output json).
# Upstream default event set is the FULL catalog — a desktop that wants a
# lighter profile can scope it, e.g.:
#   TRACEE_ARGS="--events execve,openat,connect --perf-buffer-size 256"
# (perf buffers default to 4MB per CPU; sizing them down is the main
# RAM lever — third-party measurements put idle RAM around ~500MB with
# default buffers on busy hosts)
TRACEE_ARGS=""
